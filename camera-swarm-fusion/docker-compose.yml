# Local (non-Swarm) testing for camera_edge. Requires camera_host to
# already be running on this machine (`python -m camera_host`) so that
# /run/camera-hw/camera.sock exists before this container starts.

services:
  camera-edge:
    build:
      context: .
      dockerfile: camera_edge/Dockerfile
    container_name: camera-edge
    volumes:
      - ./data:/app/data
      - /run/camera-hw:/run/camera-hw
    environment:
      DEVICE_ID: ${DEVICE_ID:-CameraPi}
      CAMERA_NAME: ${CAMERA_NAME:-cam1}
      CAMERA_SOCKET_PATH: ${CAMERA_SOCKET_PATH:-/run/camera-hw/camera.sock}
      CAMERA_FPS: ${CAMERA_FPS:-15}
      CAMERA_WIDTH: ${CAMERA_WIDTH:-1920}
      CAMERA_HEIGHT: ${CAMERA_HEIGHT:-1080}
      CAMERA_CALIBRATION_PATH: ${CAMERA_CALIBRATION_PATH:-calib/c920s_1920x1080_simple.yml}
      CAMERA_ARUCO_DICT: ${CAMERA_ARUCO_DICT:-4x4_50}
      CAMERA_MARKER_LENGTH_M: ${CAMERA_MARKER_LENGTH_M:-0.035}
      MQTT_BROKER_IP: ${MQTT_BROKER_IP:-127.0.0.1}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      CLIENT_TYPE: ${CLIENT_TYPE:-CAMERA}
      CAMERA_CSV_PATH: ${CAMERA_CSV_PATH:-/app/data/detections.csv}
      # PLC trigger, same signals as the IMU nodes (IMU_PLC_* there):
      # wait for Data_Start, send until Db_Stop, then re-arm.
      CAMERA_PLC_TRIGGER: ${CAMERA_PLC_TRIGGER:-false}
      CAMERA_PLC_PATH: ${CAMERA_PLC_PATH:-192.168.1.103}
      CAMERA_PLC_TAG_START: ${CAMERA_PLC_TAG_START:-Data_Start}
      CAMERA_PLC_TAG_STOP: ${CAMERA_PLC_TAG_STOP:-Db_Stop}
      CAMERA_PLC_POLL_S: ${CAMERA_PLC_POLL_S:-0.05}
      CAMERA_PLC_MAX_RUN_S: ${CAMERA_PLC_MAX_RUN_S:-600}
      CAMERA_PLC_FAKE: ${CAMERA_PLC_FAKE:-false}
    restart: unless-stopped
    command: ["python3", "-m", "camera_edge"]
